name: Add WhatsApp report button
on:
  push:
    paths:
      - '.github/workflows/add-whatsapp-report.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject WhatsApp report script on all HU DE EN app pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files={
            'index.html':'whatsapp-report.js?v=20260910-1',
            'de/index.html':'../whatsapp-report.js?v=20260910-1',
            'en/index.html':'../whatsapp-report.js?v=20260910-1',
            'stadt-wien/index.html':'../whatsapp-report.js?v=20260910-1',
            'de/stadt-wien/index.html':'../../whatsapp-report.js?v=20260910-1',
            'en/stadt-wien/index.html':'../../whatsapp-report.js?v=20260910-1',
          }
          for f,src in files.items():
              p=Path(f); t=p.read_text(encoding='utf-8')
              if 'whatsapp-report.js' in t: continue
              if '</body>' not in t: raise SystemExit('missing body close: '+f)
              t=t.replace('</body>','<script src="'+src+'" defer></script></body>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Strict audit
        run: |
          set -euo pipefail
          node --check whatsapp-report.js
          grep -q "4367761655592" whatsapp-report.js
          grep -q "Hiba jelentése" whatsapp-report.js
          grep -q "Fehler melden" whatsapp-report.js
          grep -q "Report an issue" whatsapp-report.js
          grep -q "wa.me" whatsapp-report.js
          grep -q "max-width:640px" whatsapp-report.js
          for f in index.html de/index.html en/index.html stadt-wien/index.html de/stadt-wien/index.html en/stadt-wien/index.html; do
            grep -q 'whatsapp-report.js' "$f"
            grep -q 'noindex,nofollow' "$f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html de/index.html en/index.html stadt-wien/index.html de/stadt-wien/index.html en/stadt-wien/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable multilingual responsive WhatsApp error reporting"
          git push
