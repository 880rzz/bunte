name: Audit Stadt Wien filters
on:
  push:
    paths:
      - '.github/workflows/audit-stadt-wien-filters.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict multilingual filter audit
        run: |
          set -euo pipefail
          node --check stadt-wien-filters.js
          grep -q "districtFromMapLink" stadt-wien-filters.js
          grep -q "district-hidden" stadt-wien-filters.js
          grep -q "Programok szűrése" stadt-wien-filters.js
          grep -q "Programme filtern" stadt-wien-filters.js
          grep -q "Filter programmes" stadt-wien-filters.js
          grep -q "0–3" stadt-wien-filters.js
          grep -q "18–25" stadt-wien-filters.js
          grep -q "for(var i=1;i<=23;i++)" stadt-wien-filters.js
          grep -q "font-size:16px" stadt-wien-filters.js
          for f in stadt-wien/index.html de/stadt-wien/index.html en/stadt-wien/index.html; do
            grep -q 'stadt-wien-filters.js' "$f"
            grep -q 'distance-system.js' "$f"
            grep -q 'noindex,nofollow' "$f"
          done
          ! grep -R 'WHC26-' -n --include='*.html' --include='*.js' .
