name: Add Stadt Wien sort sync
on:
  push:
    paths:
      - '.github/workflows/add-stadt-wien-sort-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject sort sync script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['stadt-wien/index.html','de/stadt-wien/index.html','en/stadt-wien/index.html']
          for f in files:
              p=Path(f); t=p.read_text(encoding='utf-8')
              if 'stadt-wien-sort-sync.js' in t: continue
              if f=='stadt-wien/index.html':
                  old='<script src="../distance-system.js?v=20260910-1" defer></script>'
                  new=old+'<script src="../stadt-wien-sort-sync.js?v=20260910-1" defer></script>'
              else:
                  old='<script src="../../distance-system.js?v=20260910-1" defer></script>'
                  new=old+'<script src="../../stadt-wien-sort-sync.js?v=20260910-1" defer></script>'
              if old not in t: raise SystemExit('anchor missing '+f)
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Strict audit
        run: |
          set -euo pipefail
          node --check stadt-wien-sort-sync.js
          for f in stadt-wien/index.html de/stadt-wien/index.html en/stadt-wien/index.html; do
            grep -q 'stadt-wien-filters.js' "$f"
            grep -q 'distance-system.js' "$f"
            grep -q 'stadt-wien-sort-sync.js' "$f"
            grep -q 'noindex,nofollow' "$f"
          done
          grep -q 'data-dist-min' stadt-wien-sort-sync.js
          grep -q 'data-dist-km' stadt-wien-sort-sync.js
          grep -q 'district-hidden' stadt-wien-sort-sync.js
          ! grep -R 'WHC26-' -n --include='*.html' --include='*.js' .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stadt-wien/index.html de/stadt-wien/index.html en/stadt-wien/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable distance-aware Stadt Wien card ordering"
          git push
