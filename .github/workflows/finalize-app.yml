name: Finalize Bunte app

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/finalize-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[finalize-bunte]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('app.js'), Path('de/app.js'), Path('en/app.js')]
          old = 'https://musikschulen.wien.gv.at'
          new = 'https://www.wien.gv.at/bildung/musikschule-gesangsunterricht-stimmbildung-chor'
          snippets = {
            'app.js': "\n(function(){const shell=document.querySelector('.menu-shell');if(!shell)return;const nav=shell.querySelector('.nav');if(nav)nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>shell.removeAttribute('open')));document.addEventListener('keydown',e=>{if(e.key==='Escape')shell.removeAttribute('open')});document.addEventListener('click',e=>{if(shell.open&&!shell.contains(e.target))shell.removeAttribute('open')})})();\n",
            'de/app.js': "\n(function(){const shell=document.querySelector('.menu-shell');if(!shell)return;const nav=shell.querySelector('.nav');if(nav)nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>shell.removeAttribute('open')));document.addEventListener('keydown',e=>{if(e.key==='Escape')shell.removeAttribute('open')});document.addEventListener('click',e=>{if(shell.open&&!shell.contains(e.target))shell.removeAttribute('open')})})();\n",
            'en/app.js': "\n(function(){const shell=document.querySelector('.menu-shell');if(!shell)return;const nav=shell.querySelector('.nav');if(nav)nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>shell.removeAttribute('open')));document.addEventListener('keydown',e=>{if(e.key==='Escape')shell.removeAttribute('open')});document.addEventListener('click',e=>{if(shell.open&&!shell.contains(e.target))shell.removeAttribute('open')})})();\n",
          }
          for p in files:
              text = p.read_text(encoding='utf-8')
              text = text.replace(old, new)
              marker = "(function(){const shell=document.querySelector('.menu-shell')"
              if marker not in text:
                  text += snippets[p.as_posix()]
              p.write_text(text, encoding='utf-8')

          for p in [Path('audit-fixes.js'), Path('de/audit-fixes.js'), Path('en/audit-fixes.js')]:
              if p.exists():
                  p.unlink()
          PY

      - name: Final integrity audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "WHC26-" -n --exclude-dir=.git .
          ! grep -R "musikschulen.wien.gv.at" -n --exclude-dir=.git .
          ! grep -R 'name="robots" content="index,follow' -n --include='*.html' .
          grep -q "https://programvalaszto.magyariskola.at/" index.html
          grep -q "https://www.becsinaplo.at/post/tobb-mint-egyesuleti-iskolak-a-magyaroktatas-uj-utjai-becsben" index.html
          grep -q "https://www.ferieninwien.at/" index.html
          grep -q "https://www.activity4u.at/772" index.html
          grep -q "https://prod.skrapid.at/aktuelles/2026/08/sk-rapid-herbstcamp-2026/" index.html
          grep -q "Disallow: /" robots.txt
          node --check app.js
          node --check de/app.js
          node --check en/app.js

      - name: Commit finalized app
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Bunte app runtime [finalize-bunte]"
          git push
