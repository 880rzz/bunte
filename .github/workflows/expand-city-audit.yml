name: Expand city programmes and strict audit

on:
  push:
    paths:
      - ".github/workflows/expand-city-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          old = 'https://prod.skrapid.at/aktuelles/2026/08/sk-rapid-herbstcamp-2026/'
          new = 'https://www.skrapid.at/aktuelles/2026/09/sk-rapid-herbstcamp-2026/'
          for name in ['index.html','de/index.html','en/index.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8').replace(old,new)
              s=re.sub(r'<script src="(?:\.\./)?audit-fixes\.js\?v=[^"]+" defer></script>','',s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Strict integrity audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Disallow: /' robots.txt
          grep -q 'name="robots" content="noindex,nofollow' index.html
          grep -q 'name="robots" content="noindex,nofollow' de/index.html
          grep -q 'name="robots" content="noindex,nofollow' en/index.html
          grep -q 'name="robots" content="noindex,nofollow' stadt-wien/index.html
          grep -q 'name="robots" content="noindex,nofollow' de/stadt-wien/index.html
          grep -q 'name="robots" content="noindex,nofollow' en/stadt-wien/index.html
          ! grep -R 'audit-fixes.js' -n --include='*.html' .
          ! grep -R 'WHC26-' -n --include='*.html' --include='*.js' .
          ! grep -R 'prod.skrapid.at/aktuelles/2026/08/sk-rapid-herbstcamp-2026' -n --include='*.html' .
          grep -q 'www.skrapid.at/aktuelles/2026/09/sk-rapid-herbstcamp-2026' index.html
          node --check app.js
          node --check de/app.js
          node --check en/app.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html de/index.html en/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix stale assets and verified SK Rapid link [audit]"
          git push
