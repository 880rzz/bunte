name: Fix distance camp mappings
on:
  push:
    paths:
      - '.github/workflows/fix-distance-camps.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing camp map targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('distance-system.js')
          t=p.read_text(encoding='utf-8')
          needle=" 'Wiener Herbst Camps 2026':[{l:'Ferien in Wien',d:'Wiener Herbst Camps, Wien, Austria',x:false}]\n};"
          repl=" 'Activity4u Herbstcamp':[{l:'Tennispoint Vienna',d:'Baumgasse 87, 1030 Wien, Austria',x:true}],\n 'SK Rapid Herbstcamp 2026':[{l:'Allianz Stadion',d:'Gerhard-Hanappi-Platz 1, 1140 Wien, Austria',x:true}],\n 'Wiener Herbst Camps 2026':[{l:'Ferien in Wien',d:'Wiener Herbst Camps, Wien, Austria',x:false}]\n};"
          if needle not in t:
            raise SystemExit('mapping anchor not found')
          p.write_text(t.replace(needle,repl,1),encoding='utf-8')
          PY
      - name: Audit
        shell: bash
        run: |
          set -euo pipefail
          node --check distance-system.js
          grep -q 'Activity4u Herbstcamp' distance-system.js
          grep -q 'SK Rapid Herbstcamp 2026' distance-system.js
          grep -q 'Baumgasse 87' distance-system.js
          grep -q 'Gerhard-Hanappi-Platz 1' distance-system.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distance-system.js
          git commit -m "Add Google Maps targets for autumn camp alternatives"
          git push
